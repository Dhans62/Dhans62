name: Update README repo list

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate repo list
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const username = 'Dhans62';

            const pinnedQuery = `
              query($login: String!) {
                user(login: $login) {
                  pinnedItems(first: 6, types: REPOSITORY) {
                    nodes {
                      ... on Repository {
                        name
                      }
                    }
                  }
                }
              }`;
            const pinnedData = await github.graphql(pinnedQuery, { login: username });
            const pinned = pinnedData.user.pinnedItems.nodes;
            const pinnedNames = new Set(pinned.map(r => r.name));

            const { data: repos } = await github.rest.repos.listForUser({
              username,
              sort: 'pushed',
              direction: 'desc',
              per_page: 10,
              type: 'owner'
            });
            const recent = repos.filter(r => !r.private && !r.fork && !pinnedNames.has(r.name)).slice(0, 5);

            const card = (name) =>
              `<img src="https://github-readme-stats.vercel.app/api/pin/?username=${username}&repo=${name}&hide_border=true&bg_color=00000000&title_color=8892B0&text_color=c9d1d9&icon_color=1F2A44" /><br/>\n\n`;

            let list = '';
            for (const r of pinned) list += card(r.name);
            for (const r of recent) list += card(r.name);

            let readme = fs.readFileSync('README.md', 'utf8');
            readme = readme.replace(
              /<!-- REPO-LIST:START -->[\s\S]*<!-- REPO-LIST:END -->/,
              `<!-- REPO-LIST:START -->\n${list}<!-- REPO-LIST:END -->`
            );
            fs.writeFileSync('README.md', readme);

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update repo list"
