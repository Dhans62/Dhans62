name: Update README repo list

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate repo list
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const username = 'Dhans62';

            const pinnedQuery = `
              query($login: String!) {
                user(login: $login) {
                  pinnedItems(first: 6, types: REPOSITORY) {
                    nodes {
                      ... on Repository {
                        name
                        url
                        description
                      }
                    }
                  }
                }
              }`;
            const pinnedData = await github.graphql(pinnedQuery, { login: username });
            const pinned = pinnedData.user.pinnedItems.nodes;
            const pinnedNames = new Set(pinned.map(r => r.name));

            const { data: repos } = await github.rest.repos.listForUser({
              username,
              sort: 'pushed',
              direction: 'desc',
              per_page: 10,
              type: 'owner'
            });
            const recent = repos.filter(r => !r.private && !r.fork && !pinnedNames.has(r.name)).slice(0, 5);

            let list = '';
            for (const r of pinned) {
              list += `<a href="${r.url}"><img src="https://img.shields.io/badge/${encodeURIComponent(r.name)}-1F2A44?style=for-the-badge&logo=github&logoColor=8892B0"/></a><br/>\n`;
              if (r.description) list += `<sub>${r.description}</sub>\n`;
              list += `<br/><br/>\n\n`;
            }
            for (const r of recent) {
              list += `<a href="${r.html_url}"><img src="https://img.shields.io/badge/${encodeURIComponent(r.name)}-1F2A44?style=for-the-badge&logo=github&logoColor=8892B0"/></a><br/>\n`;
              if (r.description) list += `<sub>${r.description}</sub>\n`;
              list += `<br/><br/>\n\n`;
            }

            let readme = fs.readFileSync('README.md', 'utf8');
            readme = readme.replace(
              /<!-- REPO-LIST:START -->[\s\S]*<!-- REPO-LIST:END -->/,
              `<!-- REPO-LIST:START -->\n${list}<!-- REPO-LIST:END -->`
            );
            fs.writeFileSync('README.md', readme);

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update repo list"
